<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCM Commander | Audit-Ready Edition</title>
    <style>
        :root { --primary: #1c2833; --accent: #3498db; --success: #27ae60; --bg: #f4f7f6; --warning: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background: var(--primary); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .nav-item { padding: 15px 20px; cursor: pointer; font-size: 0.85rem; border-left: 4px solid transparent; color: #bdc3c7; }
        .nav-item.active { background: #34495e; border-left-color: var(--accent); color: white; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { background: white; padding: 12px 30px; display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; align-items: center; }
        .content { padding: 25px; overflow-y: auto; flex: 1; }

        /* Rapid Header Inputs */
        .header-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; background: #2c3e50; padding: 15px; border-radius: 8px; }
        .call-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; background: #34495e; padding: 15px; border-radius: 8px; }
        input, select { padding: 10px; border: none; border-radius: 4px; font-weight: bold; width: 100%; box-sizing: border-box; outline: none; font-size: 0.85rem; }
        
        /* Logic Engine Section */
        .engine-title { color: var(--primary); font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid var(--accent); display: inline-block; }
        .ansi-box { border: 3px solid var(--accent) !important; font-size: 1rem; }

        /* Scenario Cards */
        .rarc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin-top: 10px; }
        .option-card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; border-left: 5px solid #bdc3c7; }
        .option-card:hover { border-color: var(--success); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* Output View */
        .note-output { background: #fff; padding: 25px; border-radius: 8px; margin-top: 20px; border: 1px solid #ddd; border-top: 8px solid var(--success); display: none; }
        .note-text { font-family: 'Courier New', monospace; font-size: 0.95rem; line-height: 1.4; color: #2c3e50; white-space: pre-wrap; background: #f9f9f9; padding: 15px; border: 1px dashed #7f8c8d; display: block; }
        .copy-btn { background: var(--success); color: white; border: none; padding: 15px 40px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; font-size: 1.1rem; }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 15px 30px; border-radius: 4px; display: none; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="padding: 25px; font-weight: bold; color: var(--accent); border-bottom: 1px solid #34495e;">COMMANDER 2026</div>
        <div class="nav-item active">📝 Audit Note Engine</div>
    </div>

    <div class="main">
        <div class="top-bar"><b>AR AUDIT RESOLVER</b><div id="clock" style="font-family:monospace; font-weight:bold;">00:00:00</div></div>
        <div class="content">
            
            <div class="header-grid">
                <input type="text" id="dos" placeholder="DOS (09/18/2016)">
                <input type="text" id="payer" placeholder="Payer (BCBS)">
                <input type="text" id="clm" placeholder="Claim #">
                <input type="text" id="ansi" class="ansi-box" placeholder="ANSI CODE (e.g. 16, 22)" onkeyup="triggerLogic(this.value)">
            </div>
            <div class="call-grid">
                <input type="text" id="rep" placeholder="Rep Name">
                <input type="text" id="ref" placeholder="Call Ref #">
                <input type="text" id="chk" placeholder="Check/EFT # (Optional)">
                <input type="text" id="pdate" placeholder="Paid Date (Optional)">
            </div>

            <div id="logic-display" style="display:none;">
                <div class="engine-title">SELECT SCENARIO LOGIC</div>
                <div class="rarc-grid" id="options-grid"></div>
            </div>

            <div id="manual-display" style="display:none; background:#ebf5fb; padding:20px; border-radius:8px; border: 1px solid var(--accent);">
                <div class="engine-title">MANUAL INTELLIGENCE OVERRIDE</div>
                <div style="display:grid; grid-template-columns: 1fr 1fr auto; gap:10px;">
                    <select id="man-rev">
                        <option value="however payer states no claim on file.">No Claim on File</option>
                        <option value="denied as medical records requested.">Medical Records Missing</option>
                        <option value="denied as authorization absent.">Authorization Missing</option>
                        <option value="denied as other payer is primary.">COB / Secondary Issue</option>
                    </select>
                    <select id="man-act">
                        <option value="Verified mailing address and resubmitting claim via portal.">Resubmit via Portal</option>
                        <option value="Escalated to client to provide documentation for appeal.">Escalate to Client</option>
                        <option value="Called patient to update COB records and rebill.">Call Patient & Rebill</option>
                    </select>
                    <button onclick="finalizeManual()" style="background:var(--accent); color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-weight:bold;">BUILD NOTE</button>
                </div>
            </div>

            <div id="note-card" class="note-output">
                <b style="color:var(--primary);">FINAL AR AUDIT NOTE:</b>
                <span class="note-text" id="finalNote"></span>
                <button class="copy-btn" onclick="copyResult()">COPY NOTE & NEXT CLAIM</button>
            </div>

        </div>
    </div>

    <div id="toast" class="toast">AUDIT NOTE COPIED!</div>

    <script>
        const ansiMap = {
            "16": [
                { l: "N290: Records Missing (Escalate)", r: "denied as medical records requested.", a: "Records not available in billing system. Escalated to client to provide documentation for appeal." },
                { l: "N922: NDC Issue", r: "denied for invalid or missing NDC Code.", a: "Obtained 11-digit NDC from invoice. Resubmitting corrected claim via clearinghouse." }
            ],
            "22": [
                { l: "N4: No Primary EOB (Call)", r: "denied as other payer is primary (CO 22).", a: "Primary details missing. Called patient/payer to update insurance info and requested Primary EOB." },
                { l: "Portal: Attach EOB", r: "denied as other payer is primary (CO 22).", a: "Attached Primary EOB and resubmitted via portal for secondary processing." }
            ],
            "29": [
                { l: "Timely Filing Appeal", r: "denied as time limit for filing has expired.", a: "Obtained clearinghouse acceptance report proving timely submission. Filing formal appeal with proof." }
            ]
        };

        function triggerLogic(val) {
            const code = val.trim();
            const logBox = document.getElementById('logic-display');
            const manBox = document.getElementById('manual-display');
            if(!code) { logBox.style.display = 'none'; manBox.style.display = 'none'; return; }

            if(ansiMap[code]) {
                logBox.style.display = 'block'; manBox.style.display = 'none';
                document.getElementById('options-grid').innerHTML = ansiMap[code].map((o, i) => `
                    <div class="option-card" onclick="buildFull('${o.r}', '${o.a}')">
                        <b>${o.l}</b>
                        <small>Review: ${o.r}<br>Action: ${o.a}</small>
                    </div>`).join('');
            } else {
                logBox.style.display = 'none'; manBox.style.display = 'block';
            }
        }

        function finalizeManual() {
            const r = document.getElementById('man-rev').value;
            const a = document.getElementById('man-act').value;
            buildFull(r, a);
        }

        function buildFull(review, action) {
            const d = document.getElementById('dos').value || "09/18/2016";
            const p = document.getElementById('payer').value || "BCBS";
            const c = document.getElementById('clm').value || "0256789601285";
            const rep = document.getElementById('rep').value || "IVR/Portal";
            const ref = document.getElementById('ref').value || "N/A";
            const chk = document.getElementById('chk').value;
            const pd = document.getElementById('pdate').value;

            const callInfo = `Called ${p} on ${new Date().toLocaleDateString()}, spoke with ${rep}, Ref# ${ref}.`;
            let paymentInfo = chk ? `\nPayment Info: Check/EFT# ${chk} issued on ${pd}.` : "";

            const note = `${callInfo}${paymentInfo}\n\nReview: DOS ${d}: As per review claim submitted to ${p} processed and ${review}\n\nAction: ${action} Claim# ${c}`;
            
            document.getElementById('note-card').style.display = 'block';
            document.getElementById('finalNote').innerText = note;
            window.scrollTo(0, document.body.scrollHeight);
        }

        function copyResult() {
            navigator.clipboard.writeText(document.getElementById('finalNote').innerText);
            document.getElementById('toast').style.display = 'block';
            setTimeout(() => { document.getElementById('toast').style.display = 'none'; }, 2000);
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);
    </script>
</body>
</html>
